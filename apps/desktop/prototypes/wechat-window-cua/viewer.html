<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>微信数域</title><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get('theme')==='dark'?'dark':'light';document.documentElement.dataset.platform=new URLSearchParams(location.search).get('platform')||''</script><style>
*{box-sizing:border-box}:root{--bg:#f5f5f5;--panel:#fff;--fg:#202124;--muted:#6d6d70;--line:#dedee0;--button:#242426;--button-fg:#fff}[data-theme=dark]{--bg:#1c1c1e;--panel:#272729;--fg:#f3f3f4;--muted:#aaa9ad;--line:#414145;--button:#efeff0;--button-fg:#202124}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,'Microsoft YaHei',sans-serif}button{background:var(--button);color:var(--button-fg);border:0;border-radius:8px;padding:7px 16px;cursor:pointer;font:inherit}button:hover{opacity:.82}main{padding:4px}.columns{display:flex;gap:6px;align-items:flex-start}.preview{position:relative;flex:none;min-width:240px;min-height:300px;overflow:hidden}.loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--fg);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}body.docked .loading,body.dock-failed .loading{display:none}.summary{flex:1;min-width:320px;max-height:calc(100vh - 8px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}.summary-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}h2{font-size:13px;margin:0}#phase{color:var(--muted);margin-bottom:8px}#inspection,#dock-status{display:none}#result{white-space:pre-wrap;overflow-wrap:anywhere}#shot{display:none;max-width:none;max-height:none}body.docked #shot{visibility:hidden}#error{color:#b64a4a;white-space:pre-wrap}.activity{margin:12px 0;border-top:1px solid var(--line);padding-top:10px}.activity h3{font-size:13px;margin:0}.activity-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.copy-log{padding:2px 7px;font-size:12px;background:transparent;color:var(--muted)}.copy-log:disabled{opacity:.5;cursor:default}.activity-list{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:5px;user-select:text;-webkit-user-select:text;cursor:text}.activity-row,.activity-time,.activity-message{user-select:text;-webkit-user-select:text}.activity-row{display:flex;gap:8px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.activity-time{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}.activity-message{min-width:0}.activity-row.is-error .activity-message{color:#b64a4a}[data-platform=mac] .summary{height:calc(100vh - 8px);max-height:none;display:flex;flex-direction:column;overflow:hidden}[data-platform=mac] .summary>*{flex-shrink:0}[data-platform=mac] .summary #result,[data-platform=mac] .summary #error{max-height:30%;overflow:auto}[data-platform=mac] .activity:not([hidden]){order:1;display:flex;flex-direction:column;flex:1 1 0;min-height:0;margin-bottom:0}[data-platform=mac] .activity-list{flex:1 1 0;min-height:0;max-height:none}[data-platform=mac] .summary-head{margin-bottom:4px;min-height:26px}[data-platform=mac] .summary-head h2{margin-right:auto}[data-platform=mac] #phase,[data-platform=mac] #notification-status,[data-platform=mac] #monitor-status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}[data-platform=mac] #result:empty,[data-platform=mac] #result[data-placeholder=true]{display:none}[data-platform=mac] #error{display:none}[data-platform=mac] .activity:not([hidden]){margin-top:8px;padding-top:8px}[data-platform=mac] #reconnect{margin:0!important;padding:4px 9px;font-size:12px;white-space:nowrap}.status-icons{display:flex;align-items:center;gap:8px}.status-icons[hidden]{display:none}.status-icon{position:relative;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;color:var(--muted)}.status-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.status-icon::after{content:'';position:absolute;right:0;bottom:0;width:7px;height:7px;border-radius:50%;background:var(--muted);border:1px solid var(--panel)}.status-icon[data-state=ready]::after{background:#39a66d}.status-icon[data-state=busy]::after{background:#db9a35}.status-icon[data-state=error]::after{background:#d85a54}.summary-head{position:relative}.status-tooltip{position:absolute;z-index:10;top:calc(100% + 6px);right:0;max-width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);font-size:12px;line-height:1.45;white-space:normal;overflow-wrap:anywhere;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none}.status-tooltip[hidden]{display:none}
</style></head><body><main><div class="columns"><section class="preview" id="preview"><div class="loading" aria-label="正在载入微信窗口"><span class="spinner"></span></div><img id="shot" alt=""></section><section class="summary"><div class="summary-head"><h2 id="summary-title">分析结果</h2><div id="status-icons" class="status-icons" hidden><span class="status-icon" id="analysis-icon" role="img" tabindex="0" aria-label="分析：准备中" data-tooltip="分析：准备中"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/></svg></span><span class="status-icon" id="notification-icon" role="img" tabindex="0" aria-label="系统通知：等待启动" data-tooltip="系统通知：等待启动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-2 7-2 9h16c0-2-2-2-2-9M10 20h4"/></svg></span><span class="status-icon" id="monitor-icon" role="img" tabindex="0" aria-label="窗口监听：等待启动" data-tooltip="窗口监听：等待启动"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span></div><div id="status-tooltip" class="status-tooltip" role="tooltip" hidden></div><button id="unread" disabled>分析</button></div><div id="phase">准备中…</div><div id="inspection"></div><div id="dock-status"></div><div id="notification-status" style="color:var(--muted);margin-bottom:4px"></div><div id="monitor-status" style="color:var(--muted);margin-bottom:8px"></div><section class="activity" id="activity" hidden aria-label="执行步骤"><div class="activity-head"><h3>执行步骤</h3><button class="copy-log" id="copy-log" type="button" disabled>复制日志</button></div><div class="activity-list" id="activity-list" role="log" aria-live="polite"></div></section><div id="result">点击“分析”开始</div><div id="error"></div><button id="resume-draft" type="button" hidden style="margin-top:8px;align-self:flex-start">已处理草稿，继续分析</button><button id="reconnect" hidden style="margin-top:12px">重新连接</button></section></div></main><script>
const isMac=new URLSearchParams(location.search).get('platform')==='mac';let naturalGeometry=null,monitorState='starting',reconnecting=false;
const phase=document.getElementById('phase'),result=document.getElementById('result'),error=document.getElementById('error'),shot=document.getElementById('shot'),preview=document.getElementById('preview'),analyze=document.getElementById('unread'),reconnect=document.getElementById('reconnect');
function setIcon(id,label,value,state){const icon=document.getElementById(id);icon.dataset.state=state;const stateLabel=state==='ready'?'正常':state==='error'?'异常':state==='busy'?'进行中':'未就绪';const description=`${label}（${stateLabel}）：${value}`;icon.title=description;icon.dataset.tooltip=description.length>180?description.slice(0,177)+'…':description;icon.setAttribute('aria-label',description);const tip=document.getElementById('status-tooltip');if(tip.dataset.owner===id&&!tip.hidden)tip.textContent=icon.dataset.tooltip}
wechatCua.on('phase',v=>{phase.textContent=v;if(isMac)setIcon('analysis-icon','分析',v,/失败|错误|无效|停止|取消|不可用|超时/.test(v)?'error':/正在|步骤/.test(v)?'busy':'ready');if(v==='初始化失败')analyze.disabled=true});wechatCua.on('image',v=>{shot.src=v;shot.style.display='block'});wechatCua.on('result',v=>{result.textContent=v;if(isMac)result.dataset.placeholder=/^(等待微信新消息。|检测到新消息，正在分析…|正在检查当前未读消息…|未发现可确认的未读会话。)$/.test(v)?'true':'false';error.textContent=''});wechatCua.on('error',v=>{error.textContent=v;if(phase.textContent==='初始化失败'){document.body.classList.add('dock-failed');reconnect.hidden=false}});function applyGeometry(v){naturalGeometry=v;const width=isMac?Math.min(v.width,Math.max(240,window.innerWidth-346)):v.width;const height=isMac?Math.min(v.height,Math.max(300,window.innerHeight-8)):v.height;preview.style.width=`${width}px`;preview.style.height=`${height}px`;shot.style.width=`${width}px`;shot.style.height=`${height}px`}wechatCua.on('geometry',applyGeometry);wechatCua.on('inspection',v=>document.getElementById('inspection').textContent=`UIA：${v.count} 个子节点`);
if(isMac){analyze.hidden=true;document.getElementById('summary-title').textContent='微信分析';document.getElementById('status-icons').hidden=false;const statusTip=document.getElementById('status-tooltip');for(const icon of document.querySelectorAll('.status-icon')){const showTip=()=>{statusTip.dataset.owner=icon.id;statusTip.textContent=icon.dataset.tooltip;statusTip.hidden=false};const hideTip=()=>{if(statusTip.dataset.owner===icon.id){statusTip.hidden=true;statusTip.dataset.owner=''}};icon.addEventListener('mouseenter',showTip);icon.addEventListener('mouseleave',hideTip);icon.addEventListener('focus',showTip);icon.addEventListener('blur',hideTip)}document.querySelector('.summary-head').append(reconnect);document.querySelector('.summary').addEventListener('pointerdown',()=>wechatCua.interaction());result.textContent='等待微信新消息。';result.dataset.placeholder='true';document.getElementById('activity').hidden=false;const activityList=document.getElementById('activity-list'),copyLog=document.getElementById('copy-log');copyLog.onclick=async()=>{try{await wechatCua.copyLog([...activityList.children].map(row=>[...row.children].map(part=>part.textContent).join(' ')).join('\n'));copyLog.textContent='已复制';setTimeout(()=>{copyLog.textContent='复制日志'},1500)}catch(e){window.appendWechatStep({message:`复制日志失败：${e instanceof Error?e.message:String(e)}`,level:'error',at:Date.now()})}};window.appendWechatStep=v=>{if(!v||typeof v.message!=='string')return;const row=document.createElement('div'),time=document.createElement('span'),message=document.createElement('span');row.className='activity-row'+(v.level==='error'?' is-error':'');time.className='activity-time';time.textContent=new Date(Number.isFinite(v.at)?v.at:Date.now()).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});message.className='activity-message';message.textContent=v.message;row.append(time,message);const follow=activityList.scrollHeight-activityList.scrollTop-activityList.clientHeight<40;activityList.append(row);copyLog.disabled=false;while(activityList.children.length>100)activityList.firstElementChild.remove();if(follow)activityList.scrollTop=activityList.scrollHeight};wechatCua.on('step',window.appendWechatStep);const resumeDraft=document.getElementById('resume-draft');resumeDraft.onclick=()=>void wechatCua.resumeAfterDraft();wechatCua.on('draft-state',v=>{resumeDraft.hidden=v!=='pending'});wechatCua.on('notification-status',v=>{document.getElementById('notification-status').textContent=v;setIcon('notification-icon','系统通知',v,/失败|不可用|已停止|退出|权限|找不到/.test(v)?'error':/正在|等待/.test(v)?'busy':'ready')});wechatCua.on('monitor-status',v=>{document.getElementById('monitor-status').textContent=v;setIcon('monitor-icon','窗口监听',v,/失败|不可用|已停止|退出|中断|超时/.test(v)?'error':/正在|等待|暂停/.test(v)?'busy':'ready')});wechatCua.on('monitor-state',v=>{monitorState=v;const text=document.getElementById('monitor-status').textContent||'等待启动';setIcon('monitor-icon','窗口监听',text,v==='ready'?'ready':v==='failed'?'error':'busy');updateReconnect()})}
analyze.onclick=()=>{result.textContent='正在读取最近 10 条消息…';error.textContent='';wechatCua.unread()};
function updateReconnect(){if(!isMac)return;const busy=reconnecting||monitorState==='starting';reconnect.disabled=busy;reconnect.textContent=busy?'正在重连…':'重新连接';reconnect.hidden=monitorState==='ready'&&!reconnecting}

reconnect.onclick=async()=>{if(!isMac){reconnect.hidden=true;error.textContent='';document.body.classList.remove('dock-failed');void wechatCua.reconnect();return}if(reconnecting)return;reconnecting=true;monitorState='starting';error.textContent='';document.body.classList.remove('dock-failed');updateReconnect();try{const response=await wechatCua.reconnect();if(response&&!response.ok)throw new Error(response.error||'重新连接失败')}catch(e){monitorState='failed';error.textContent=e instanceof Error?e.message:String(e);setIcon('monitor-icon','窗口监听',error.textContent,'error');window.appendWechatStep({message:`重新连接失败：${error.textContent}`,level:'error',at:Date.now()})}finally{reconnecting=false;updateReconnect()}};
let targetHandle=0;let pendingDock=0;function dockNow(){if(!targetHandle)return;const r=preview.getBoundingClientRect();if(r.width>0&&r.height>0)wechatCua.dock(targetHandle,{x:r.x,y:r.y,width:r.width,height:r.height})}function scheduleDock(){clearTimeout(pendingDock);pendingDock=setTimeout(dockNow,180)}wechatCua.on('dock-target',v=>{targetHandle=v.handle;scheduleDock()});wechatCua.on('dock-status',v=>{document.getElementById('dock-status').textContent=v;const ok=v.startsWith('微信原生窗口已嵌入');document.body.classList.toggle('docked',ok);document.body.classList.toggle('dock-failed',v.startsWith('嵌入失败'));analyze.disabled=!ok;if(ok){error.textContent='';if(!isMac)reconnect.hidden=true;else updateReconnect()}});window.addEventListener('resize',()=>{if(isMac&&naturalGeometry)applyGeometry(naturalGeometry);scheduleDock()});
</script></body></html>
