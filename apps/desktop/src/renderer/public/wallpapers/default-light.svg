<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-label="浅色 AI 桌面壁纸：错落的智能轨道">
  <defs>
    <linearGradient id="sky" x2="1" y2="1">
      <stop stop-color="#f6f6f5"/><stop offset=".6" stop-color="#efefee"/><stop offset="1" stop-color="#e6e6e5"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#ffffff" stop-opacity=".94"/><stop offset=".36" stop-color="#d4d4d2" stop-opacity=".46"/><stop offset="1" stop-color="#d4d4d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outer" x1=".13" y1=".1" x2=".88" y2=".92">
      <stop stop-color="#ffffff"/><stop offset=".48" stop-color="#d0d0ce"/><stop offset="1" stop-color="#a9a9a8"/>
    </linearGradient>
    <linearGradient id="inner" x1=".1" y1=".9" x2=".9" y2=".1">
      <stop stop-color="#c3c3c1"/><stop offset=".52" stop-color="#f7f7f6"/><stop offset="1" stop-color="#d1d1cf"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".48" stop-color="#d6d6d4"/><stop offset="1" stop-color="#8e8e8d"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="85"/></filter>
  </defs>
  <rect width="3840" height="2160" fill="url(#sky)"/>
  <ellipse cx="2940" cy="1080" rx="1200" ry="930" fill="url(#aura)"/>
  <ellipse cx="2940" cy="1110" rx="340" ry="220" fill="#ffffff" opacity=".72" filter="url(#soft)"/>
  <ellipse cx="2940" cy="1080" rx="930" ry="620" transform="rotate(-24 2940 1080)" fill="none" stroke="url(#outer)" stroke-width="16" stroke-linecap="round" stroke-dasharray="1700 760 1700 760" opacity=".78"/>
  <g transform="translate(0 2160) scale(1 -1) rotate(24 2940 1080)" fill="none" stroke="url(#inner)" stroke-width="32" stroke-linecap="round" opacity=".9">
    <ellipse cx="2940" cy="1080" rx="625" ry="405" stroke-dasharray="1115 2159"/>
    <ellipse cx="2940" cy="1080" rx="625" ry="405" stroke-dasharray="1115 2159" stroke-dashoffset="-1637"/>
  </g>
  <ellipse cx="2940" cy="1080" rx="176" ry="104" transform="rotate(-24 2940 1080)" fill="url(#core)"/>
  <ellipse cx="2895" cy="1052" rx="57" ry="31" transform="rotate(-24 2895 1052)" fill="#ffffff" opacity=".83"/>
