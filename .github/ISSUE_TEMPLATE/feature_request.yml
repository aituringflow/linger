name: Feature request
description: Propose a capability or a change in behaviour
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For anything larger than a small change, opening this issue first saves rework.
        Please describe the problem before the solution — the best implementation is
        often not the first one proposed.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - packages/agent-kit (server runtime)
        - packages/agent-kit (React UI)
        - apps/web
        - apps/desktop (desktop app)
        - docs / build tooling
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does it currently break down?
      placeholder: "When a session produces many artifacts, ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Behaviour you would like, including API or configuration shape if you have one in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds you already use, and why they are insufficient
    validations:
      required: false

  - type: dropdown
    id: breaking
    attributes:
      label: Would this change existing behaviour?
      options:
        - "No — additive only"
        - "Yes — existing API or data changes"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, upstream constraints, anything a reviewer should know
    validations:
      required: false
